name: Compose Smoke Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/compose-smoke.yml'
      - 'compose.yml'
      - 'Dockerfile'
      - 'scripts/smoke-test.sh'
      - '**/src/main/resources/db/migration/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/compose-smoke.yml'
      - 'compose.yml'
      - 'Dockerfile'
      - 'scripts/smoke-test.sh'
      - '**/src/main/resources/db/migration/**'

permissions:
  contents: read

concurrency:
  group: compose-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Full stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start the platform
        run: docker compose up --build --wait --wait-timeout 600

      - name: Run the end-to-end order smoke test
        run: sh ./scripts/smoke-test.sh

      - name: Show service status
        if: always()
        continue-on-error: true
        run: docker compose ps --all

      - name: Capture service logs on failure
        if: failure()
        continue-on-error: true
        run: docker compose logs --no-color --timestamps --tail=500

      - name: Remove containers and volumes
        if: always()
        continue-on-error: true
        run: docker compose down --volumes --remove-orphans
