server:
  port: ${PAYMENT_SERVICE_PORT:8182}

logging:
  level:
    com.food.ordering.system: ${APP_LOG_LEVEL:INFO}

payment-service:
  payment-request-topic-name: ${PAYMENT_REQUEST_TOPIC:payment-request}
  payment-response-topic-name: ${PAYMENT_RESPONSE_TOPIC:payment-response}
  outbox-scheduler-fixed-rate: ${PAYMENT_OUTBOX_SCHEDULER_FIXED_RATE:10000}
  outbox-scheduler-initial-delay: ${PAYMENT_OUTBOX_SCHEDULER_INITIAL_DELAY:10000}

spring:
  application:
    name: payment-service
  jpa:
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
  datasource:
    url: "${PAYMENT_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=payment&binaryTransfer=true&reWriteBatchedInserts=true&stringtype=unspecified}"
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: payment
    default-schema: payment
    create-schemas: true
    clean-disabled: true

kafka-config:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092,localhost:29092,localhost:39092}
  schema-registry-url-key: schema.registry.url
  schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
  num-of-partitions: ${KAFKA_PARTITIONS:3}
  replication-factor: ${KAFKA_REPLICATION_FACTOR:3}

kafka-producer-config:
  key-serializer-class: org.apache.kafka.common.serialization.StringSerializer
  value-serializer-class: io.confluent.kafka.serializers.KafkaAvroSerializer
  compression-type: snappy
  acks: all
  batch-size: 16384
  batch-size-boost-factor: 100
  linger-ms: 5
  request-timeout-ms: 60000
  retry-count: 5

kafka-consumer-config:
  key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
  payment-consumer-group-id: ${PAYMENT_REQUEST_CONSUMER_GROUP_ID:payment-topic-consumer}
  auto-offset-reset: earliest
  specific-avro-reader-key: specific.avro.reader
  specific-avro-reader: true
  batch-listener: true
  auto-startup: true
  concurrency-level: 3
  session-timeout-ms: 10000
  heartbeat-interval-ms: 3000
  max-poll-interval-ms: 300000
  max-poll-records: 500
  max-partition-fetch-bytes-default: 1048576
  max-partition-fetch-bytes-boost-factor: 1
  poll-timeout-ms: 150

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  application:
    name: ${spring.application.name}
    description: Credit-ledger payment processing and compensation worker
