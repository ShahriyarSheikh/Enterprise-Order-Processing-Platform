server:
  port: ${CUSTOMER_SERVICE_PORT:8184}

spring:
  application:
    name: customer-service
  jpa:
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
  datasource:
    url: "${CUSTOMER_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=customer&binaryTransfer=true&reWriteBatchedInserts=true}"
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: customer
    default-schema: customer
    create-schemas: true
    clean-disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  application:
    name: ${spring.application.name}
    description: Customer reference-data service for the order demo
